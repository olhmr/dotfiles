# Deliberately small. tmux owns sessions, windows, panes and status, so
# anything that would duplicate tmux is left unset on purpose. Swapping
# emulator later means porting these few lines and nothing else.

font_family           FantasqueSansM Nerd Font Mono
font_size             15.0

# No tabs, no splits: tmux does that. Hide the bar so it never appears.
tab_bar_style         hidden

# Remote control stays off. Nothing here needs to drive the terminal, and off
# means no local process, including an agent, can reach it.
allow_remote_control  no

# Wider symbol glyphs sit right against the window edge without a little
# horizontal breathing room. Vertical stays 0 so no rows are lost.
window_padding_width     0 4

confirm_os_window_close  0
enable_audio_bell        no

# Powerline and Nerd Font glyphs come from the non-mono variant, which is what
# iTerm2 did with its separate non-ASCII font. The Mono variant squeezes every
# glyph into one cell, which is why the icons looked small.
symbol_map U+E000-U+E00A,U+E0A0-U+E0A3,U+E0B0-U+E0D4 FantasqueSansM Nerd Font
symbol_map U+E200-U+E2A9,U+E300-U+E3E3,U+E5FA-U+E6B7 FantasqueSansM Nerd Font
symbol_map U+EA60-U+EC1E,U+ED00-U+EFCE,U+F000-U+F2FF FantasqueSansM Nerd Font
symbol_map U+F300-U+F32F,U+F400-U+F533,U+F0001-U+F1AF0 FantasqueSansM Nerd Font

# Colours ported from dotfiles/gruvbox-material-mod.itermcolors, which
# matches the gruvbox-material colorscheme in Neovim.
background            #292827
foreground            #f7ddb1
cursor                #ddc7a1
cursor_text_color     #282828
selection_background  #c5b18d
selection_foreground  #655b53
color0                #3c3836
color1                #b85651
color2                #8f9a52
color3                #c18f41
color4                #68948a
color5                #ab6c7d
color6                #72966c
color7                #a89984
color8                #5a524c
color9                #b85651
color10               #a9b665
color11               #d8a657
color12               #7daea3
color13               #d3869b
color14               #89b482
color15               #ddc7a1

# Window height is rarely an exact multiple of the cell height. The default
# centres the leftover pixels, which shows as a gap above the tmux status bar.
# top-left pushes all of it to the bottom edge instead.
placement_strategy       top-left
