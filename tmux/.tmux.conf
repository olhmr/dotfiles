set-option -g status-position top
set -g default-terminal 'tmux-256color'
set -as terminal-features ',*:RGB:usstyle'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'janders223/gruvbox-tmux'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# gruvbox-tmux
set -g @gruvbox-show-battery false
set -g @gruvbox-show-network false
set -g @gruvbox-show-weather false
set -g @gruvbox-show-location false
set -g @gruvbox-show-powerline true
set -g @gruvbox-show-flags true
set -g @gruvbox-show-time false
set -g @gruvbox-military-time true
set -g @gruvbox-show-left-icon session
set -g @gruvbox-border-contrast true
set -g @gruvbox-cpu-usage true
set -g @gruvbox-ram-usage true
set -g @gruvbox-gpu-usage false
set -g @gruvbox-day-month true

# Set the control character to Ctrl+Spacebar (instead of Ctrl+B)
set -g prefix C-space
unbind-key C-b
bind-key C-space send-prefix

# Set new panes to open in current directory
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# List sessions
bind-key s choose-session # here because I accidentally unbound it once

# Keep track of sessions, windows, and panes for multi-agent work
# set -g @process_tracker_script "/path/to/tmux-process-tracker/scripts/list-processes.sh"
# source-file /Users/olle.hammarstrom/workspace/personal/tmux-plugin/tmux-process-tracker.tmux

# Jump to the last active Claude Code pane
bind-key G run-shell "~/.claude/bin/agent-jump"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# --- agent inbox -----------------------------------------------------------
# prefix+a  list every live agent, blocked first, and jump to one
# prefix+G  skip the menu, go straight to the most urgent
# status    a count of agents by state, in the centre of the bar
bind-key a display-popup -E -w 80% -h 50% "~/.claude/bin/agent-pick"
set -g status-interval 10
set -g status-right-length 140

# The theme's last right segment ends flush against the terminal edge, so its
# text touches the last column. One space in the segment's own colours pads the
# text inward and carries the block to the edge, which mirrors the left, where
# the green block starts at column 0 and holds a space before the name.
# tpm rebuilds status-right on every reload, so this append does not stack up.
set -ag status-right '#[fg=#282828,bg=#d65d0e] '

# The centre is not a settable option, so the count is appended to the status
# line format itself, after the right region. An absolute-centre chunk is drawn
# centred on the full width, whatever the other regions hold, and appending
# leaves the theme's own left/list/right regions untouched.
# The reset first makes a config reload idempotent: without it every reload
# appends another copy. It must name the array, not the element: unsetting
# status-format[0] empties that one line and loses the left, window list and
# right regions with it, where unsetting status-format restores the whole
# default array. So this assumes no plugin sets status-format, which
# gruvbox-tmux does not.
set -gu status-format
set -ag 'status-format[0]' '#[nolist align=absolute-centre]#(~/.claude/bin/agent-count)'
